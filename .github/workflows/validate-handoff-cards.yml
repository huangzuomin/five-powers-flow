name: Validate FPF PR Role Separation and Handoff

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  validate-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR and base history (untrusted source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install jsonschema pyyaml

      - name: Fail-closed GitHub-authenticated review and PR routing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PYTHONPATH=.
          python -m packages.fpf_policy.pr_gate

      # A CODE_PR cannot report green for self-authored QA text. Require a
      # verified independent QA artifact producer before enabling code merge.
