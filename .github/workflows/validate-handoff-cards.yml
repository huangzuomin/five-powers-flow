name: Validate FPF PR Role Separation and Handoff

# Pull_request_target reads workflow definition from protected default branch.
# Candidate checkout must never be executed as code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  validate-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base gate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate for Git object inspection
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependencies
        run: python -m pip install jsonschema pyyaml
      - name: Run trusted gate, never untrusted PR scripts
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/trusted
          FPF_CANDIDATE_REPO: ${{ github.workspace }}/candidate
        run: |
          cd trusted
          python -m packages.fpf_policy.pr_gate
