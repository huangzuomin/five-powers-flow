name: Validate FPF PR Role Separation and Handoff

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  validate-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR and base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependencies
        run: python -m pip install jsonschema pyyaml
      - name: Restore trusted policy gate from base
        run: |
          # The gate is the union of the review/card logic (packages/fpf_policy)
          # and the evidence requirement table REQUIRED_PROFILE_EVIDENCES
          # (packages/fpf_coordinator). Anchor both to base: otherwise a PR can
          # raise its own bar (un-gateable) or silently lower it (self-weakening).
          # If base lags main, rebase the branch; required checks run strict.
          git checkout ${{ github.event.pull_request.base.sha }} -- packages/fpf_policy/ packages/fpf_coordinator/
      - name: Fail-closed GitHub-authenticated review and PR routing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PYTHONPATH=.
          python -m packages.fpf_policy.pr_gate
