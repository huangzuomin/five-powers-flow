name: FPF State Ledger Publish

# The only job allowed to write the ledger (F2 v3 §2). Triggered by a completed
# upstream run, so this definition always comes from the default branch; the
# upstream artifact is treated as untrusted data and never executed.

on:
  workflow_run:
    workflows: ["FPF State Ledger Project"]
    types: [completed]

permissions: {}

concurrency:
  group: fpf-state-ledger-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: read
      checks: read
    steps:
      - name: Checkout the trusted publish definition
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install projector dependencies
        run: python -m pip install pyyaml

      - name: Pin and verify the trusted workflow SHA
        env:
          PINNED_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test -n "${PINNED_SHA}"
          git cat-file -e "${PINNED_SHA}^{commit}"
          git merge-base --is-ancestor "${PINNED_SHA}" origin/main
          git checkout --detach "${PINNED_SHA}"
          python -c "import json,os;print(json.dumps({'pinned_sha':os.environ['PINNED_SHA'],'workflow_ref':os.environ.get('GITHUB_WORKFLOW_REF','')},sort_keys=True))" > publish-evidence.json

      - name: Collect upstream facts (untrusted, read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: fpf-state-candidate-${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > upstream-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" > upstream-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          run = json.loads(Path("upstream-run.json").read_text(encoding="utf-8"))
          name = os.environ["ARTIFACT_NAME"]
          artifacts = [
              item for item in json.loads(Path("upstream-artifacts.json").read_text(encoding="utf-8"))["artifacts"]
              if item.get("name") == name and not item.get("expired") and item.get("workflow_run", {}).get("id") == run["id"]
          ]
          if len(artifacts) != 1:
              raise SystemExit("ARTIFACT_OWNERSHIP: expected exactly one unexpired candidate artifact")
          artifact = artifacts[0]
          Path("artifact.json").write_text(json.dumps({
              "id": artifact["id"],
              "name": artifact["name"],
              "digest": artifact.get("digest") or "",
          }, sort_keys=True), encoding="utf-8")
          print("artifact", artifact["id"], artifact.get("digest"))
          PY
          test -n "$(python -c "import json;print(json.load(open('artifact.json'))['digest'])")"
          mkdir -p artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$(python -c "import json;print(json.load(open('artifact.json'))['id'])")/zip" > candidate.zip
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          with zipfile.ZipFile("candidate.zip") as archive:
              manifest = json.loads(archive.read("manifest.json").decode("utf-8"))
          Path("manifest.json").write_text(json.dumps(manifest, sort_keys=True), encoding="utf-8")
          Path("manifest.env").write_text(
              "\n".join([
                  f"FPF_TASK_ID={manifest['task_id']}",
                  f"FPF_PROJECT_ID={manifest.get('project_id', 'FPF')}",
                  f"FPF_PR_NUMBER={int(manifest['pr_number'])}",
                  f"FPF_PROJECTION_DIGEST={manifest['projection_digest']}",
              ]) + "\n",
              encoding="utf-8",
          )
          PY
          cat manifest.env >> "$GITHUB_ENV"

      - name: Snapshot the target ledger and idempotency state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LEDGER_PATH="packages/fpf_coordinator/dispatch/state-ledger.json"
          gh api "repos/${GITHUB_REPOSITORY}/contents/${LEDGER_PATH}?ref=main" > target.json
          python - <<'PY'
          import json
          from pathlib import Path
          target = json.loads(Path("target.json").read_text(encoding="utf-8"))
          Path("target-blob.json").write_text(json.dumps({"blob_sha": target["sha"]}, sort_keys=True), encoding="utf-8")
          PY
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest_digest = ""
          try:
              import zipfile
              with zipfile.ZipFile("candidate.zip") as archive:
                  manifest_digest = json.loads(archive.read("manifest.json").decode("utf-8"))["projection_digest"]
          except Exception:
              manifest_digest = ""
          branch = f"fpf/state-ledger/{manifest_digest[:16]}" if manifest_digest else ""
          exists = False
          if branch:
              probe = subprocess.run(
                  ["gh", "api", f"repos/{__import__('os').environ['GITHUB_REPOSITORY']}/git/ref/heads/{branch}"],
                  capture_output=True, text=True,
              )
              exists = probe.returncode == 0
          Path("idempotency.json").write_text(json.dumps({
              "branch": branch, "exists": exists,
          }, sort_keys=True), encoding="utf-8")
          print("idempotency", branch, exists)
          PY

      - name: Run the trusted publish gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m packages.fpf_coordinator.dispatch.publish_gate \
            --repo "${GITHUB_REPOSITORY}" \
            --pr-number "${FPF_PR_NUMBER}" \
            --project-id "${FPF_PROJECT_ID}" \
            --zip candidate.zip \
            --artifact-digest "$(python -c "import json;print(json.load(open('artifact.json'))['digest'])")" \
            --upstream upstream-run.json \
            --target target-blob.json \
            --idempotency idempotency.json \
            --out publish-decision.json

      - name: Publish the gated projection PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS=$(python -c "import json;print(json.load(open('publish-decision.json'))['status'])")
          if [ "$STATUS" = "NOOP_ALREADY_PUBLISHED" ]; then
            echo "NOOP_ALREADY_PUBLISHED: nothing to write" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$STATUS" = "PROCEED"
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile("candidate.zip") as archive:
              Path("packages/fpf_coordinator/dispatch/state-ledger.json").write_bytes(archive.read("state-ledger.json"))
          PY
          BRANCH="fpf/state-ledger/${FPF_PROJECTION_DIGEST:0:16}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add packages/fpf_coordinator/dispatch/state-ledger.json
          git commit -m "docs(fpf): project event-driven state ledger for ${FPF_TASK_ID}"
          git push origin "$BRANCH"
          HEAD_SHA=$(git rev-parse HEAD)
          BASE_SHA=$(git rev-parse HEAD^)
          DIGEST="$FPF_PROJECTION_DIGEST"
          AUTH_REF=$(python -c "import json;print(json.load(open('manifest.json')).get('authorization_ref',''))")
          EXPIRES=$(python -c "import json;print(json.load(open('manifest.json')).get('scope_expires_at',''))")
          cat > pr-body.md <<EOF
          ## FPF event-driven state ledger projection

          Generated by \`state-project-publish.yml\` from trusted main code. It does not approve or merge itself.

          <!-- fpf-state-publish:${DIGEST} -->

          \`\`\`yaml
          kind: POLICY_CHANGE
          policy_version: 1
          task_id: ${FPF_TASK_ID}
          tested_code_sha: $HEAD_SHA
          baseline_sha: $BASE_SHA
          changed_files:
            - packages/fpf_coordinator/dispatch/state-ledger.json
          risk_acknowledged: true
          authorization_ref: "$AUTH_REF"
          authorized_by: "project-owner"
          scope_expires_at: "$EXPIRES"
          \`\`\`
          EOF
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "FPF state projection: ${FPF_TASK_ID}" \
              --body-file pr-body.md
          else
            echo "PR #$EXISTING already exists for $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpf-state-publish-${{ github.run_id }}
          path: |
            publish-decision.json
            publish-evidence.json
            upstream-run.json
            upstream-artifacts.json
            artifact.json
            target-blob.json
            idempotency.json
            pr-body.md
          if-no-files-found: warn
          retention-days: 90
