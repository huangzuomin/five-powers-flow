name: FPF State Ledger Reconcile

on:
  push:
    paths:
      - "packages/fpf_coordinator/dispatch/**"
      - ".github/workflows/state-reconcile.yml"
  workflow_dispatch:
    inputs:
      task_id:
        description: FPF task ID
        required: true
        default: FPF2-G4-EVDEMO-01
        type: string
      project_id:
        description: FPF project ID
        required: true
        default: FPF
        type: string
      pr_number:
        description: Implementation PR number; 0 discovers it from task_id
        required: true
        default: "0"
        type: string
      source_ref:
        description: Commit to replay from; main is authoritative, anything else is a labelled trial
        required: true
        default: main
        type: string

permissions: {}

concurrency:
  group: fpf-state-ledger-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout replay source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install projector dependencies
        run: python -m pip install pyyaml
      - name: Resolve the task and PR behind a push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          test -n "$PR"
          TASK=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq .body | python -c "
          import sys, yaml
          from packages.fpf_coordinator.coordinator import extract_yaml_block
          body = sys.stdin.read()
          text = extract_yaml_block(body, 'POLICY_CHANGE') or extract_yaml_block(body, 'DEV_HANDOFF')
          print(yaml.safe_load(text)['task_id'])
          ")
          echo "FPF_PR_NUMBER=$PR" >> "$GITHUB_ENV"
          echo "FPF_TASK_ID=$TASK" >> "$GITHUB_ENV"
          echo "replaying PR #$PR for task $TASK"
      - name: Replay GitHub facts and compare the committed ledger
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_PROJECT_ID: ${{ inputs.project_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          FPF_TASK_ID="${INPUT_TASK_ID:-${FPF_TASK_ID:-FPF2-G4-EVDEMO-01}}"
          FPF_PROJECT_ID="${INPUT_PROJECT_ID:-${FPF_PROJECT_ID:-FPF}}"
          FPF_PR_NUMBER="${INPUT_PR_NUMBER:-${FPF_PR_NUMBER:-0}}"
          FPF_SOURCE_REF="${INPUT_SOURCE_REF:-${FPF_SOURCE_REF:-$GITHUB_SHA}}"
          # Ruling T-01: this workflow never creates a check run, for any trigger.
          # The authoritative `fpf-state-ledger-audit` check belongs solely to
          # state-audit.yml, whose definition always comes from the default branch.
          echo "Read-only replay of \`$FPF_SOURCE_REF\`: no check run created (T-01)." >> "$GITHUB_STEP_SUMMARY"
          python -m packages.fpf_coordinator.dispatch.poller reconcile \
            --repo "${{ github.repository }}" \
            --task-id "$FPF_TASK_ID" \
            --project-id "$FPF_PROJECT_ID" \
            --pr-number "$FPF_PR_NUMBER" \
            --ledger packages/fpf_coordinator/dispatch/state-ledger.json \
            --no-check-run \
            --report "reconciliation-${GITHUB_RUN_ID}.json"
      - name: Assert this workflow cannot create an authoritative check (T-01)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODE=$(curl -s -o check-run-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" \
            -d "{\"name\":\"fpf-state-ledger-audit\",\"head_sha\":\"${GITHUB_SHA}\",\"status\":\"completed\",\"conclusion\":\"success\"}")
          echo "trial check-run POST status: ${CODE}" >> "$GITHUB_STEP_SUMMARY"
          test "${CODE}" = "403"
      - name: Retain reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpf-state-reconciliation-${{ github.run_id }}
          path: reconciliation-*.json
          if-no-files-found: warn
          retention-days: 30
