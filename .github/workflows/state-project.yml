name: FPF State Ledger Project

on:
  push:
    paths:
      - "packages/fpf_coordinator/dispatch/**"
      - ".github/workflows/state-project.yml"
  workflow_dispatch:
    inputs:
      task_id:
        description: FPF task ID
        required: true
        type: string
      project_id:
        description: FPF project ID
        required: true
        default: FPF
        type: string
      pr_number:
        description: Source implementation PR number
        required: true
        type: string
      base_sha:
        description: Trusted main commit or ref to branch from
        required: true
        default: main
        type: string
      authorization_ref:
        description: Human authorization or work-order reference
        required: true
        type: string
      scope_expires_at:
        description: Expiry of the referenced authorization (ISO-8601 UTC); never defaulted
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

concurrency:
  group: fpf-state-ledger-project
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FPF_TRIAL: ${{ github.event_name == 'push' && '1' || '0' }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install projector dependencies
        run: python -m pip install pyyaml
      - name: Resolve the task and PR behind a push
        if: env.FPF_TRIAL == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          test -n "$PR"
          TASK=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq .body | python -c "
          import sys, yaml
          from packages.fpf_coordinator.coordinator import extract_yaml_block
          body = sys.stdin.read()
          text = extract_yaml_block(body, 'POLICY_CHANGE') or extract_yaml_block(body, 'DEV_HANDOFF')
          print(yaml.safe_load(text)['task_id'])
          ")
          echo "FPF_PR_NUMBER=$PR" >> "$GITHUB_ENV"
          echo "FPF_TASK_ID=$TASK" >> "$GITHUB_ENV"
      - name: Generate deterministic ledger candidate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_PROJECT_ID: ${{ inputs.project_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          FPF_TASK_ID="${INPUT_TASK_ID:-${FPF_TASK_ID:-FPF2-G4-EVDEMO-01}}"
          FPF_PROJECT_ID="${INPUT_PROJECT_ID:-${FPF_PROJECT_ID:-FPF}}"
          FPF_PR_NUMBER="${INPUT_PR_NUMBER:-${FPF_PR_NUMBER:-0}}"
          python -m packages.fpf_coordinator.dispatch.poller project \
            --repo "${{ github.repository }}" \
            --task-id "$FPF_TASK_ID" \
            --project-id "$FPF_PROJECT_ID" \
            --pr-number "$FPF_PR_NUMBER" \
            --out packages/fpf_coordinator/dispatch/state-ledger.json \
            --event-log "event-log-${{ github.run_id }}.jsonl"
      - name: Commit ledger on an isolated branch
        if: env.FPF_TRIAL == '0'
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="fpf/state-ledger-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add packages/fpf_coordinator/dispatch/state-ledger.json
          git commit -m "docs(fpf): project event-driven state ledger for ${{ inputs.task_id }}"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
      - name: Open gated projection PR
        if: env.FPF_TRIAL == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          BASE_SHA: ${{ steps.commit.outputs.base_sha }}
        run: |
          set -euo pipefail
          cat > pr-body.md <<EOF
          ## FPF event-driven state ledger projection

          This PR is generated by \`state-project.yml\`. It does not approve or merge itself.

          \`\`\`yaml
          kind: POLICY_CHANGE
          policy_version: 1
          task_id: ${{ inputs.task_id }}
          tested_code_sha: $HEAD_SHA
          baseline_sha: $BASE_SHA
          changed_files:
            - packages/fpf_coordinator/dispatch/state-ledger.json
          risk_acknowledged: true
          authorization_ref: "${{ inputs.authorization_ref }}"
          authorized_by: "project-owner"
          scope_grant_id: "gr-${{ inputs.pr_number }}-${BASE_SHA:0:12}"
          scope_expires_at: "${{ inputs.scope_expires_at }}"
          \`\`\`
          EOF
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "FPF state projection: ${{ inputs.task_id }}" \
            --body-file pr-body.md
      - name: Retain projector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpf-state-projection-${{ github.run_id }}
          path: |
            event-log-*.jsonl
            pr-body.md
          if-no-files-found: warn
          retention-days: 30
