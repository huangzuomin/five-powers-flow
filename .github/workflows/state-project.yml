name: FPF State Ledger Project

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: FPF task ID
        required: true
        type: string
      project_id:
        description: FPF project ID
        required: true
        default: FPF
        type: string
      pr_number:
        description: Source implementation PR number
        required: true
        type: string
      base_sha:
        description: Trusted main commit or ref to branch from
        required: true
        default: main
        type: string
      authorization_ref:
        description: Human authorization or work-order reference
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

concurrency:
  group: fpf-state-ledger-project
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install projector dependencies
        run: python -m pip install pyyaml
      - name: Generate deterministic ledger candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m packages.fpf_coordinator.dispatch.poller project \
            --repo "${{ github.repository }}" \
            --task-id "${{ inputs.task_id }}" \
            --project-id "${{ inputs.project_id }}" \
            --pr-number "${{ inputs.pr_number }}" \
            --out packages/fpf_coordinator/dispatch/state-ledger.json \
            --event-log "event-log-${{ github.run_id }}.jsonl"
      - name: Commit ledger on an isolated branch
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="fpf/state-ledger-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add packages/fpf_coordinator/dispatch/state-ledger.json
          git commit -m "docs(fpf): project event-driven state ledger for ${{ inputs.task_id }}"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
      - name: Open gated projection PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          BASE_SHA: ${{ steps.commit.outputs.base_sha }}
        run: |
          set -euo pipefail
          cat > pr-body.md <<EOF
          ## FPF event-driven state ledger projection

          This PR is generated by \`state-project.yml\`. It does not approve or merge itself.

          \`\`\`yaml
          kind: POLICY_CHANGE
          policy_version: 1
          task_id: ${{ inputs.task_id }}
          tested_code_sha: $HEAD_SHA
          baseline_sha: $BASE_SHA
          changed_files:
            - packages/fpf_coordinator/dispatch/state-ledger.json
          risk_acknowledged: true
          authorization_ref: "${{ inputs.authorization_ref }}"
          authorized_by: "project-owner"
          scope_grant_id: "gr-${{ inputs.pr_number }}-${BASE_SHA:0:12}"
          scope_expires_at: "2030-01-01T00:00:00Z"
          \`\`\`
          EOF
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "FPF state projection: ${{ inputs.task_id }}" \
            --body-file pr-body.md
      - name: Retain projector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpf-state-projection-${{ github.run_id }}
          path: |
            event-log-*.jsonl
            pr-body.md
          if-no-files-found: warn
          retention-days: 30
