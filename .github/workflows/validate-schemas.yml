name: Validate Schemas, Specs and Run Boundary Tests

on:
  push:
    branches: [main]
  pull_request:
    # Also validate stacked feature PRs before their parent PR reaches main.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Validate JSON Schemas
        run: |
          python -c "
          import json, glob, jsonschema
          for path in glob.glob('schemas/*.json'):
              with open(path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              jsonschema.Draft7Validator.check_schema(data)
              print(f'Valid schema: {path}')
          "

      - name: Run Trusted Evaluator Boundary Tests
        run: |
          export PYTHONPATH=.
          python -m unittest discover -s tests -p "test_*.py"

      - name: Assert No Duplicate Module Trees
        run: |
          dup=$(find packages -maxdepth 1 -type d | sed 's|packages/||; s|-|_|g' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::Duplicate module directories (dash/underscore variants): $dup"
            exit 1
          fi
          echo "Package structure verified clean."
