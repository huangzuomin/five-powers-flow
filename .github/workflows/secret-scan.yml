name: Secret Scan

# G3 credential boundary. This check fails closed on any pattern hit in the
# repository, on every pull request and every push to main. It complements
# GitHub's native secret scanning: that one knows vendor formats, this one also
# knows FPF's own material (PEM blocks, 64-hex seeds next to key wording).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files
        run: python tools/security/scan_secrets.py --tracked

      - name: Prove the scanner still blocks a planted secret
        run: |
          export PYTHONPATH=.
          python -m unittest discover -s tests -p "test_secret_scan.py" -v
