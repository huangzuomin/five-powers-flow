[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "five-powers-flow"
version = "1.2.1"
description = "Separation-of-Powers Autonomous Software Engineering Framework for High-Assurance Multi-Agent Collaboration"
readme = "README.md"
authors = [{ name = "Five-Powers-Flow Contributors" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
agents = ["openai-agents>=0.6"]
dev = ["pytest>=7.0"]

[project.scripts]
fpf = "packages.fpf_bootstrap.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]
